<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
            background-color: #f5f9ff;
}
        }

        table {
            width: 80%;
            border-collapse: collapse;
            margin: auto;
            background-color: white;
        }

        th, td {
            border: 1px solid #2f75b5;
            padding: 10px;
            text-align: center;
        }

        .heading {
            background-color: #5b9bd5;
            color: white;
            font-weight: bold;
        }

        .menu {
            background-color: #d9eaf7;
            color: #1f4e79;
            font-weight: bold;
        }

        h1 {
            text-align: center;
        }
    </style>
</head>

<body>

   

    <table>

        

        <!-- Books -->
        <tr>
            <td rowspan="4">
                CSE<br><br>
                ECE<br><br>
                EEE<br><br>
                CIVIL
            </td>

            <th>Book name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Amount</th>
        </tr>

        <tr>
            <td>Java 2</td>
            <td>$35.5</td>
            <td>2</td>
            <td>$70</td>
        </tr>

        <tr>
            <td>XML Bible</td>
            <td>$40.5</td>
            <td>1</td>
            <td>$40.5</td>
        </tr>

        <tr>
            <td colspan="3"><b>Total amount</b></td>
            <td><b>$110.5</b></td>
        </tr>

    </table>

</body>
</html>

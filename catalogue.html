<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GL Bajaj Online Bookstore - Catalogue</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { text-align: center; background-color: #2f75b5; padding: 15px; border: 1px solid black; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 12px; text-align: center; }
        th { background-color: #2f75b5; }
        .cart { background-color: #2f75b5; border: 1px solid black; padding: 8px 15px; cursor: pointer; }
        .cart:hover { background-color: #1f4e79; }
        .bar { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        a { color: black; text-decoration: none; }
        a:hover { color: blue; text-decoration: underline; }
    </style>
</head>
<body>

<h1>GL Bajaj Online Bookstore — Catalogue</h1>

<div class="bar">
    <label>Branch:
        <select id="branchFilter">
            <option value="all">All Books</option>
            <option value="general">General</option>
            <option value="cse">CSE</option>
            <option value="ece">ECE</option>
            <option value="eee">EEE</option>
            <option value="civil">Civil</option>
        </select>
    </label>
    <a href="cart.html">View Shopping Cart 🛒</a>
</div>

<table>
    <thead>
        <tr>
            <th>Book Cover</th>
            <th>Book Details</th>
            <th>Author</th>
            <th>Price</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="bookRows"></tbody>
</table>

<script src="branch-catalogue.js"></script>
<script>
    // The original 4 catalogue books
    const generalBooks = [
        { id: "xml", name: "XML Bible", publisher: "Wiley", author: "Winston", price: 405,
          image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlHAZYskcjTsfXh4bT1oOenvlavEo5e2veeK7FRwi33A&s=10" },
        { id: "ai", name: "Artificial Intelligence", publisher: "Prentice Hall", author: "S. Russell", price: 630,
          image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDaeVTgnyjhsf8nJOMUSIFiareDL4DSOcwzDz0QLZXbw&s=10" },
        { id: "java", name: "Java 2", publisher: "BPB Publications", author: "Watson", price: 355,
          image: "https://covers.openlibrary.org/b/isbn/9780132222204-M.jpg" },
        { id: "html24", name: "HTML in 24 Hours", publisher: "Sams Publication", author: "Sam Peter", price: 500,
          image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQDgkteM93IAD-33O2dsPyMnYnr8l4S9MzAJoYB7BAJ8Q&s=10" }
    ];

    const tableBody = document.getElementById("bookRows");

    function renderCatalogue(filter) {
        tableBody.innerHTML = "";

        let list = [];
        if (filter === "all" || filter === "general") {
            list = list.concat(generalBooks.map(b => ({ book: b, branch: "" })));
        }
        Object.keys(branchBooks).forEach(key => {
            if (filter === "all" || filter === key) {
                branchBooks[key].books.forEach(b => list.push({ book: b, branch: key.toUpperCase() }));
            }
        });

        list.forEach(item => {
            const book = item.book;
            const row = document.createElement("tr");

            const cover = document.createElement("td");
            cover.appendChild(makeCover(book));

            const details = document.createElement("td");
            const bold = document.createElement("b");
            bold.textContent = book.name;
            details.appendChild(bold);
            if (book.publisher) {
                details.appendChild(document.createElement("br"));
                details.append("Publication: " + book.publisher);
            }
            if (item.branch) {
                details.appendChild(document.createElement("br"));
                details.append("Branch: " + item.branch);
            }

            const author = document.createElement("td");
            author.textContent = book.author;

            const price = document.createElement("td");
            price.textContent = formatINR(book.price);

            const action = document.createElement("td");
            const button = document.createElement("button");
            button.className = "cart";
            button.textContent = "Add to Cart";
            button.onclick = () => addBranchBook(book);
            action.appendChild(button);

            row.append(cover, details, author, price, action);
            tableBody.appendChild(row);
        });
    }

    document.getElementById("branchFilter").addEventListener("change", function () {
        renderCatalogue(this.value);
    });
    renderCatalogue("all");
</script>
</body>
</html>

<!DOCTYPE html>

<head>
    <title>GL Bajaj Online Bookstore - Catalogue</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            text-align: center;
            background-color: #2f75b5;
            padding: 15px;
            border: 1px solid black;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #2f75b5;
        }

        .menu {
            background-color: #d9eaf7;
        }

        .book {
            width: 100px;
            height: 130px;
        }

        .cart {
            background-color: #2f75b5;
            border: 1px solid black;
            padding: 8px 15px;
            cursor: pointer;
        }

        .cart:hover {
            background-color: #1f4e79;
        }

        a {
            color: black;
            text-decoration: none;
        }

        a:hover {
            color: blue;
            text-decoration: underline;
        }
        .book-cover {
            width: 85px;
            height: 115px;
            object-fit: contain;
        }
    </style>
</head>

</table>

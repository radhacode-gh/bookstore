<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GL bajaj Bookstore</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f9ff;
        }


        .main-container {
            width: 100%;
            min-height: 100vh;
            border: 2px solid black;
        }


        .college-name {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;

            background-color: white;

            border-bottom: 1px solid black;

            font-size: 28px;
            font-weight: bold;
        }


        .bookstore-header {
            height: 77px;

            display: grid;
            grid-template-columns: 20% 80%;

            background-color: #2563eb;

            border-bottom: 1px solid black;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .bookstore-title {
            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
            font-weight: bold;
        }


        .navigation {
            height: 47px;

            display: grid;
            grid-template-columns: repeat(5, 1fr);

            background-color: #dbeafe;

            border-bottom: 1px solid black;
        }

        .navigation a {
            display: flex;
            justify-content: center;
            align-items: center;

            color: black;
            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            border-right: 1px solid #999;

            cursor: pointer;
        }

        .navigation a:last-child {
            border-right: none;
        }

        .navigation a:hover {
            background-color: #bfdbfe;
        }


        .body-area {
            display: grid;
            grid-template-columns: 20% 80%;

            min-height: 428px;
        }


        .left-panel {
            background-color: #dbeafe;

            border-right: 2px solid black;
        }

        /* FIXED: no fixed height / single border, so no stray line between ECE and EEE */
        .branch-link {
            width: 100%;
        }

        /* each branch gets its own row, with a line between rows */
        .branch-link div {
            border-bottom: 1px solid #aaa;
        }

        .branch-link a {
            display: block;
            width: 100%;
            padding: 15px 0;
            text-align: center;

            color: blue;
            text-decoration: underline;
            cursor: pointer;

            font-size: 18px;
            font-weight: bold;
        }

        .branch-link a:hover {
            background-color: #bfdbfe;
        }


        .right-panel {
            background-color: white;

            position: relative;

            overflow: auto;
        }


        .home-content {
            height: 428px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 18px;
            font-weight: bold;
        }


        #contentFrame {
            width: 100%;
            height: 100%;

            min-height: 428px;

            border: none;

            display: none;
        }

        /* FOOTER */
        .footer {
            min-height: 90px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background-color: #2563eb;
            color: white;

            border-top: 1px solid black;

            font-size: 15px;
            font-weight: bold;

            text-align: center;
            padding: 10px;
        }

        .footer p {
            margin: 3px 0;
        }

        .footer a {
            color: white;
            text-decoration: underline;
        }

        .footer a:hover {
            color: #dbeafe;
        }

    </style>
</head>

<body>

<div class="main-container">


    <div class="college-name">
        GLB INSTITUTE OF TECHNOLOGY AND MANAGEMENT
    </div>


    <div class="bookstore-header">

        <div class="logo">
            <img src="logo.jpg" alt="GL Bajaj Logo">
        </div>

        <div class="bookstore-title">
            GL BAJAJ BOOKSTORE
        </div>

    </div>


    <div class="navigation">

        <a href="#" onclick="showHome(); return false;">
            Home
        </a>

        <a href="login.html" onclick="openPage('login.html'); return false;">
            Login
        </a>

        <a href="registration.html" onclick="openPage('registration.html'); return false;">
            Registration
        </a>

        <a href="catalogue.html" onclick="openPage('catalogue.html'); return false;">
            Catalogue
        </a>

        <a href="cart.html" onclick="openPage('cart.html'); return false;">
            Cart
        </a>

    </div>


    <div class="body-area">


        <div class="left-panel">

            <div class="branch-link">

                <!-- CSE -->
                <div>
                    <a href="cse.html" onclick="openPage('cse.html'); return false;">CSE</a>
                </div>

                <!-- ECE -->
                <div>
                    <a href="ece.html" onclick="openPage('ece.html'); return false;">ECE</a>
                </div>

                <!-- EEE -->
                <div>
                    <a href="eee.html" onclick="openPage('eee.html'); return false;">EEE</a>
                </div>

                <!-- CIVIL -->
                <div>
                    <a href="civil.html" onclick="openPage('civil.html'); return false;">CIVIL</a>
                </div>

            </div>

        </div>


        <div class="right-panel" id="rightPanel">


            <div id="homeContent" class="home-content">

                Find your favorite books easily at affordable prices.

            </div>


            <iframe
                id="contentFrame"
                name="contentFrame">
            </iframe>


        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        <p>Name: Radha</p>
        <p>Roll No: 2501920110289</p>
        <p>
            GitHub:
            <a href="https://github.com/radhacode-gh" target="_blank">
                https://github.com/radhacode-gh
            </a>
        </p>
    </div>


</div>


<script>

    function openPage(page) {

        document.getElementById("homeContent").style.display = "none";

        const frame = document.getElementById("contentFrame");

        frame.style.display = "block";

        frame.src = page;
    }


    function showHome() {

        const frame = document.getElementById("contentFrame");

        frame.style.display = "none";

        frame.src = "";

        document.getElementById("homeContent").style.display = "flex";
    }


    function blankPage() {

        const frame = document.getElementById("contentFrame");

        frame.style.display = "none";

        frame.src = "";

        document.getElementById("homeContent").style.display = "none";
    }

</script>

</body>
</html>
